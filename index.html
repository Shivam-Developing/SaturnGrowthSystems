<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Saturn Growth Systems — Independent Growth Studio</title>
    <meta name="description" content="Saturn Growth Systems solves commercial business friction, delivers high-converting digital presence, WhatsApp automation, and custom software." />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-saturn-bg text-saturn-cream font-sans selection:bg-saturn-green selection:text-black antialiased overflow-x-hidden">
    <!-- Netlify Form Detection Scaffold -->
    <form name="contact" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
      <p>
        <label>Name <input type="text" name="name" /></label>
      </p>
      <p>
        <label>Email <input type="email" name="email" /></label>
      </p>
      <p>
        <label>Company <input type="text" name="company" /></label>
      </p>
      <p>
        <label>Phone / WhatsApp <input type="text" name="contact" /></label>
      </p>
      <p>
        <label>Business Description <input type="text" name="bizdesc" /></label>
      </p>
      <p>
        <label>Problem <textarea name="problem"></textarea></label>
      </p>
      <p>
        <button type="submit">Send</button>
      </p>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
